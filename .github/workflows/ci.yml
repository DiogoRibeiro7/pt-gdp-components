name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Dataset boundary tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_dataexcept_io.py -v

      - name: Synthetic pipeline smoke test
        env:
          MPLBACKEND: Agg
        run: python tests/smoke_synthetic.py
